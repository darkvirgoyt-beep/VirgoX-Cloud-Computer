<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#060810" />
  <title>VirgoX Cloud Computer — Workstation</title>
  <link rel="stylesheet" href="style.css?v=20261002" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Security Lock Screen -->
  <div class="lock-screen" id="security-curtain" role="status" aria-live="polite" aria-label="Verifying session credentials">
    <div class="spinner"></div>
    <div class="lock-title">⚡ VIRGOX SECURITY GATEWAY</div>
    <div class="lock-subtitle">Verifying authenticated session credentials...</div>
  </div>

  <!-- Protected App Shell -->
  <div id="app" class="app-container" hidden></div>

  <script type="module">
    import { auth } from './assets/auth-client.js';

    // Session gate — runs before anything else
    (async function() {
      'use strict';

      const root = document.documentElement;
      const curtain = document.getElementById('security-curtain');
      const app = document.getElementById('app');

      function settle(outcome) {
        root.setAttribute('data-vxc-session', outcome);
        root.removeAttribute('data-vxc-claiming');
        document.dispatchEvent(new CustomEvent('virgox:session', { detail: outcome }));
      }

      function deny() {
        auth.signOut();
        settle('no');
        window.location.replace('index.html');
      }

      function accept(email) {
        const role = sessionStorage.getItem('virgox_user_role') || (email === 'darkvirgoyt@gmail.com' ? 'owner' : 'guest');
        root.setAttribute('data-user-mode', role);
        settle('ok');
        curtain.classList.add('hidden');
        app.hidden = false;
      }

      // Parse claim from URL (set by vxc auth login)
      const params = new URLSearchParams(location.search);
      const claim = params.get('vxc_claim');
      const authBase = params.get('vxc_auth');

      function rememberAuthBase(raw) {
        if (!raw) return null;
        try {
          const u = new URL(raw);
          return (u.protocol === 'http:' || u.protocol === 'https:') ? u.origin : null;
        } catch { return null; }
      }

      function stripClaim() {
        params.delete('vxc_claim');
        params.delete('vxc_auth');
        const q = params.toString();
        history.replaceState(null, '', location.pathname + (q ? '?' + q : '') + location.hash);
      }

      function readSession() {
        const ok = sessionStorage.getItem('virgox_authenticated') === 'true';
        const token = sessionStorage.getItem('virgox_session_token');
        const email = (sessionStorage.getItem('virgox_user_email') || '').toLowerCase();
        return (ok && token && email) ? { token, email } : null;
      }

      const base = rememberAuthBase(authBase);

      // Case 1: Claim present — redeem it
      if (claim && base) {
        root.setAttribute('data-vxc-claiming', '1');
        const result = await auth.redeemClaim(base, claim);
        if (!result.success) { deny(); return; }
        stripClaim();
        accept(result.email);
        return;
      }

      // Case 2: No claim — check existing session
      stripClaim();
      const session = readSession();
      if (!session) { deny(); return; }

      // Verify with backend if we have an auth base
      if (base) {
        const verified = await auth.verifySessionWithBackend(base, session.token);
        if (!verified.valid) { deny(); return; }
      }

      accept(session.email);
    })();
  </script>

  <!-- Protected Core Workstation Engine -->
  <script src="assets/workstation.core.js?v=20261002"></script>
</body>
</html>
