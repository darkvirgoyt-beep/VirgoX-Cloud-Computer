<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VirgoX Cloud Computer — Workstation</title>
  <link rel="stylesheet" href="style.css?v=20260930_06" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a0b10" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <style>
    /* Security Curtain: Workstation is locked and hidden until validated */
    html, body {
      background: #060810;
      color: #fff;
      margin: 0;
      padding: 0;
      height: 100%;
    }
    #app {
      display: none !important;
    }
    body.virgox-authorized #app {
      display: flex !important;
    }
    .security-lock-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #060810;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Rajdhani', sans-serif;
      z-index: 999999;
      transition: opacity 0.3s ease;
    }
    body.virgox-authorized .security-lock-screen {
      display: none !important;
    }
    .lock-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(0, 229, 255, 0.2);
      border-top-color: #00e5ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script>
    // IMMEDIATE SYNCHRONOUS TAMPER-PROOF AUTHENTICATION GATEWAY
    (function() {
      'use strict';
      const isAuth = sessionStorage.getItem('virgox_authenticated') === 'true';
      const token = sessionStorage.getItem('virgox_session_token');
      const email = (sessionStorage.getItem('virgox_user_email') || '').toLowerCase();

      // Non-bypassable: If auth is missing or altered, purge and force immediate redirect to login
      if (!isAuth || !token || !email) {
        try {
          sessionStorage.clear();
          localStorage.removeItem('virgox_active_session');
          if (document.documentElement) document.documentElement.innerHTML = '';
        } catch(e) {}
        window.location.replace('index.html');
        throw new Error('SECURITY_VERIFICATION_REQUIRED');
      }

      const role = sessionStorage.getItem('virgox_user_role') || (email === 'darkvirgoyt@gmail.com' ? 'owner' : 'guest');
      document.documentElement.setAttribute('data-user-mode', role);
    })();
  </script>
</head>
<body>
  <!-- Security Splash while verifying -->
  <div class="security-lock-screen" id="security-curtain">
    <div class="lock-spinner"></div>
    <div style="font-weight: 700; letter-spacing: 1px; color: #00e5ff; font-size: 1.1rem;">⚡ VIRGOX SECURITY GATEWAY</div>
    <div style="font-size: 0.85rem; color: #a0aec0; margin-top: 6px;">Verifying authenticated session credentials...</div>
  </div>

  <!-- Protected App Shell (Populated dynamically ONLY after verified login) -->
  <div id="app" class="app-container"></div>

  <!-- Protected Core Workstation Engine (Mounts DOM & executes app controller) -->
  <script src="assets/workstation.core.js"></script>
</body>
</html>
