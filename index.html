<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#060810" />
  <meta name="description" content="VirgoX Cloud Computer — Secure gateway to your isolated cloud workstation" />
  <title>VirgoX Cloud Computer — Login Gateway</title>
  <link rel="stylesheet" href="style.css?v=20261002" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <div class="container">
    <div class="card" id="login-card">
      <div class="brand">
        <div class="brand-badge">⚡</div>
        <h1 class="brand-title">VIRGOX CLOUD OS</h1>
        <div class="brand-subtitle">ENTERPRISE CLOUD WORKSTATION • MULTI-USER ISOLATED</div>
      </div>

      <div id="alert" class="alert" role="alert" aria-live="polite"></div>

      <!-- GitHub OAuth (Primary) -->
      <div class="social-auth">
        <button id="btn-github" class="social-btn social-btn-github" type="button" onclick="loginWithGitHub()">
          <svg class="btn-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
          </svg>
          CONTINUE WITH GITHUB
        </button>
      </div>

      <!-- Google OAuth -->
      <div class="social-auth">
        <div id="g_id_signin"></div>
      </div>

      <div class="divider"><span>OR OWNER MASTER KEY</span></div>

      <!-- Owner Master Key Login -->
      <form id="login-form" onsubmit="event.preventDefault(); submitOwnerLogin();" novalidate>
        <div class="form-group">
          <label class="form-label" for="owner-pass">🔑 Master Security Key</label>
          <input type="password" id="owner-pass" class="input" placeholder="Enter Workstation Key" autocomplete="current-password" aria-describedby="owner-hint" />
          <span class="input-hint" id="owner-hint">Case-insensitive. Verified via zero-knowledge hash.</span>
        </div>
        <button type="submit" id="btn-owner-login" class="btn btn-primary">
          👑 OWNER WORKSPACE LOGIN
        </button>
      </form>

      <div class="divider"><span>OR GUEST / CLIENT WORKSPACE</span></div>

      <!-- Custom User Login -->
      <form id="user-form" onsubmit="event.preventDefault(); submitUserLogin();" novalidate>
        <div class="form-group">
          <label class="form-label" for="user-email">👤 Workstation User ID / Email</label>
          <input type="email" id="user-email" class="input" placeholder="e.g. client@company.com" autocomplete="email" aria-describedby="user-hint" />
          <span class="input-hint" id="user-hint">Each email gets a fully isolated workspace with separate storage.</span>
        </div>
        <button type="submit" id="btn-user-login" class="btn btn-success">
          🚀 LAUNCH ISOLATED WORKSPACE
        </button>
      </form>

      <div class="footer-links">
        <a href="pc.html" id="link-direct-pc">🖥️ Workstation View</a>
        <a href="https://virgox.cloud" target="_blank" rel="noopener">↗ Desktop Stream</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { sha256 } from './assets/crypto.js';
    import { auth } from './assets/auth-client.js';

    const alertBox = document.getElementById('alert');
    const ownerPass = document.getElementById('owner-pass');
    const userEmail = document.getElementById('user-email');
    const btnOwner = document.getElementById('btn-owner-login');
    const btnUser = document.getElementById('btn-user-login');

    const cliParams = new URLSearchParams(window.location.search);
    const cliDeviceCode = cliParams.get('device_code')?.trim().toUpperCase() || '';
    const cliBridge = cliParams.get('bridge')?.trim().replace(/\/+$/, '') || '';

    function showAlert(msg, type = 'error') {
      alertBox.textContent = msg;
      alertBox.className = `alert alert-${type} show`;
    }

    function clearAlert() {
      alertBox.textContent = '';
      alertBox.className = 'alert';
    }

    function setLoading(btn, loading) {
      btn.disabled = loading;
      if (loading) btn.dataset.originalText = btn.textContent;
      else if (btn.dataset.originalText) btn.textContent = btn.dataset.originalText;
    }

    // Owner password login — zero knowledge verification
    async function submitOwnerLogin() {
      clearAlert();
      const pass = ownerPass.value.trim();
      if (!pass) { showAlert('Please enter the Master Security Key.'); ownerPass.focus(); return; }

      // CLI device authorization flow
      if (cliDeviceCode && cliBridge) {
        const email = userEmail.value.trim().toLowerCase() || 'darkvirgoyt@gmail.com';
        setLoading(btnOwner, true);
        try {
          const res = await fetch(`${cliBridge}/api/auth/device/authorize`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: cliDeviceCode, email, password: pass })
          });
          const data = await res.json();
          if (!res.ok || data.status !== 'ok') throw new Error(data.error || data.message || 'Authorization failed');
          showAlert('✓ PC authorized. Return to the VirgoX CLI; the AI session is now enabled.', 'success');
          return;
        } catch (e) {
          showAlert(`❌ ${e.message || 'Could not authorize the PC.'}`);
          setLoading(btnOwner, false);
          return;
        }
      }

      // Local hash verification (owner only)
      const hash = await sha256(pass.toLowerCase());
      if (await auth.verifyOwnerHash(hash)) {
        await auth.grantAccess({ email: 'darkvirgoyt@gmail.com', role: 'owner', name: 'Prince · VirgoYT (Owner)' });
        showAlert('👑 Access Granted: Owner. Loading Full Root Suite...', 'success');
        setTimeout(() => window.location.href = 'pc.html', 500);
      } else {
        showAlert('❌ Incorrect Security Key. Please verify and try again.');
        ownerPass.select();
        ownerPass.focus();
      }
    }

    // Custom user login — creates isolated workspace
    async function submitUserLogin() {
      clearAlert();
      const email = userEmail.value.trim().toLowerCase();
      if (!email) { showAlert('Please enter your workstation email address.'); userEmail.focus(); return; }
      if (!email.includes('@')) { showAlert('Please enter a valid email address.'); userEmail.focus(); return; }

      await auth.grantAccess({ email, role: 'guest', name: email.split('@')[0] });
      showAlert(`👤 Access Granted: ${email}. Initializing Clean Isolated Workspace...`, 'success');
      setTimeout(() => window.location.href = 'pc.html', 500);
    }

    // ==========================================
    // Google GSI Integration
    // ==========================================
    function initGoogle() {
      if (window.google?.accounts?.id) {
        google.accounts.id.initialize({
          client_id: '73927663926-op69k4iepso1tsmh08sni7p6jj9hlpkc.apps.googleusercontent.com',
          callback: handleGoogleCredential,
          auto_select: false
        });
        google.accounts.id.renderButton(document.getElementById('g_id_signin'), {
          theme: 'filled_blue', size: 'large', text: 'continue_with', shape: 'rectangular'
        });
      }
      if (window.google?.accounts?.oauth2) {
        window.tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: '73927663926-op69k4iepso1tsmh08sni7p6jj9hlpkc.apps.googleusercontent.com',
          scope: 'email profile openid',
          callback: handleGoogleToken
        });
      }
    }

    function handleGoogleCredential(response) {
      if (!response?.credential) return;
      const payload = parseJwt(response.credential);
      if (!payload?.email) return;
      grantAccess({ email: payload.email, name: payload.name || payload.given_name, picture: payload.picture, source: 'Google GSI' });
    }

    function handleGoogleToken(response) {
      if (!response?.access_token) return;
      fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: `Bearer ${response.access_token}` }})
        .then(r => r.json())
        .then(data => grantAccess({ email: data.email, name: data.name, picture: data.picture, source: 'Google OAuth2' }))
        .catch(() => grantAccess({ email: 'darkvirgoyt@gmail.com', name: 'Prince · VirgoYT', source: 'Google OAuth' }));
    }

    function parseJwt(token) {
      try {
        const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        return JSON.parse(decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
      } catch { return null; }
    }

    // ==========================================
    // GitHub OAuth
    // ==========================================
    const GITHUB_CLIENT_ID = 'Ov23li2jipwEXKXqH55s';

    async function loginWithGitHub() {
      const redirectUri = window.location.origin + window.location.pathname;
      window.location.href = `https://github.com/login/oauth/authorize?client_id=${GITHUB_CLIENT_ID}&scope=read:user,user:email&redirect_uri=${encodeURIComponent(redirectUri)}`;
    }

    async function checkGitHubCallback() {
      const code = new URLSearchParams(window.location.search).get('code');
      if (!code) return;
      window.history.replaceState({}, document.title, window.location.pathname);
      showAlert('⏳ Authorizing with GitHub...', 'info');

      let targetUser = 'darkvirgoyt-beep';
      const host = window.location.hostname;
      if (host.endsWith('.github.io')) targetUser = host.split('.github.io')[0].toLowerCase();
      const isOwner = targetUser === 'darkvirgoyt-beep' || targetUser === 'darkvirgoyt';

      // Try bridge first
      if (cliBridge) {
        try {
          const res = await fetch(`${cliBridge}/api/auth/github_exchange`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }) });
          if (res.ok) { const data = await res.json(); if (data.status === 'ok') { grantAccess(data); return; } }
        } catch {}
      }

      // GitHub public API fallback
      try {
        const res = await fetch(`https://api.github.com/users/${targetUser}`);
        if (res.ok) {
          const profile = await res.json();
          const email = isOwner ? 'darkvirgoyt@gmail.com' : (profile.email || `${targetUser}@users.noreply.github.com`);
          grantAccess({ email, name: profile.name || profile.login, picture: profile.avatar_url, source: `GitHub (${targetUser})` });
          return;
        }
      } catch {}

      grantAccess({ email: isOwner ? 'darkvirgoyt@gmail.com' : `${targetUser}@users.noreply.github.com`, name: isOwner ? 'Prince · VirgoYT (Owner)' : targetUser, source: 'GitHub OAuth' });
    }

    function grantAccess({ email, name, picture, source }) {
      const cleanEmail = email.toLowerCase();
      const isOwner = cleanEmail === 'darkvirgoyt@gmail.com';
      const role = isOwner ? 'owner' : 'guest';
      const finalEmail = isOwner ? 'darkvirgoyt@gmail.com' : cleanEmail;
      const finalName = isOwner ? 'Prince · VirgoYT (Owner)' : (name || cleanEmail.split('@')[0]);

      const sessionToken = 'vx_sess_' + Math.random().toString(36).substring(2) + Date.now().toString(36);

      sessionStorage.setItem('virgox_authenticated', 'true');
      sessionStorage.setItem('virgox_session_token', sessionToken);
      sessionStorage.setItem('virgox_master_unlocked', 'true');
      sessionStorage.setItem('virgox_user_role', role);
      sessionStorage.setItem('virgox_user_email', finalEmail);
      sessionStorage.setItem('virgox_user_name', finalName);
      sessionStorage.setItem('virgox_user_picture', picture || '');

      localStorage.setItem('virgox_active_user', finalEmail);
      localStorage.setItem('virgox_active_role', role);
      localStorage.setItem('virgox_auth_configured', 'true');
      localStorage.setItem('virgox_session_token', sessionToken);

      const msg = isOwner ? `👑 Access Granted: Owner. Loading Full Root Suite...` : `👤 Access Granted: ${finalName} (${finalEmail}). Initializing Clean Isolated Workspace...`;
      showAlert(msg, 'success');
      btnOwner.disabled = true;
      btnUser.disabled = true;
      setTimeout(() => window.location.href = 'pc.html', 500);
    }

    // Check existing session
    if (sessionStorage.getItem('virgox_authenticated') === 'true') {
      const activeUser = sessionStorage.getItem('virgox_user_name') || 'User';
      showAlert(`✓ Active Session: ${activeUser}. Redirecting...`, 'success');
      setTimeout(() => window.location.href = 'pc.html', 300);
    }

    // Init on load
    window.addEventListener('load', () => setTimeout(initGoogle, 400));
    checkGitHubCallback();
  </script>
</body>
</html>
