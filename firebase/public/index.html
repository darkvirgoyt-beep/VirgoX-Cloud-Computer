<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VirgoX CLI Authorization</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="brand">⚡ VIRGOX</div>
      <h1>Authorize terminal</h1>
      <p class="muted">Sign in to authorize this VirgoX CLI session.</p>
      <div class="code" id="code">--------</div>
      <form id="login">
        <label>Email<input id="email" type="email" autocomplete="email" required></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Sign in &amp; authorize</button>
      </form>
      <div class="divider"><span>or</span></div>
      <button id="github" type="button" class="secondary">Continue with GitHub</button>
      <p id="message" class="message"></p>
      <p class="muted small">The one-time authorization code expires automatically.</p>
    </section>
  </main>
  <script src="/__/firebase/12.0.0/firebase-app-compat.js"></script>
  <script src="/__/firebase/12.0.0/firebase-auth-compat.js"></script>
  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
