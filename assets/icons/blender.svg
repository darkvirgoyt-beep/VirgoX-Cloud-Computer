<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="blenderBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00"/>
      <stop offset="50%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9233"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Modern App Container -->
  <rect x="14" y="14" width="100" height="100" rx="20" fill="#141824" stroke="url(#blenderBorder)" stroke-width="2.5"/>
  
  <!-- Blender Symbol -->
  <g transform="translate(64,62)">
    <!-- 3 Radiating Arms -->
    <!-- Top-left arm -->
    <path d="M -8 -8 L -34 -28 A 7 7 0 0 1 -24 -38 L -2 -14 Z" fill="url(#orangeGrad)"/>
    <!-- Top arm -->
    <path d="M -2 -10 L -2 -42 A 6 6 0 0 1 10 -42 L 8 -10 Z" fill="url(#orangeGrad)"/>
    <!-- Right arm -->
    <path d="M 8 -4 L 38 -4 A 6 6 0 0 1 38 8 L 8 6 Z" fill="url(#orangeGrad)"/>
    
    <!-- Main Outer Orange Ring -->
    <circle cx="0" cy="8" r="28" fill="none" stroke="url(#orangeGrad)" stroke-width="11"/>
    
    <!-- Inner Core Blue Dot with Glow -->
    <circle cx="0" cy="8" r="11" fill="url(#blueGrad)" filter="url(#glow)"/>
    <circle cx="-3" cy="5" r="3.5" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>
