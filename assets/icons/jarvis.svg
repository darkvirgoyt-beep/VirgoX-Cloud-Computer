<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="jarvisBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00ffff"/>
    </linearGradient>
    <linearGradient id="reactorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0052d4"/>
    </linearGradient>
    <filter id="jarvisGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Modern App Container -->
  <rect x="14" y="14" width="100" height="100" rx="22" fill="#080d1a" stroke="url(#jarvisBorder)" stroke-width="2.5"/>
  <!-- Arc Reactor / Holographic Rings -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="8, 4" opacity="0.7"/>
  <circle cx="64" cy="64" r="30" fill="none" stroke="#4facfe" stroke-width="2.5" stroke-dasharray="14, 4"/>
  <circle cx="64" cy="64" r="22" fill="none" stroke="#00ffff" stroke-width="3" filter="url(#jarvisGlow)"/>
  <!-- Center Core -->
  <circle cx="64" cy="64" r="12" fill="url(#reactorGrad)"/>
  <circle cx="64" cy="64" r="6" fill="#ffffff" filter="url(#jarvisGlow)"/>
  <!-- Sound Wave / Vision Rays -->
  <line x1="64" y1="20" x2="64" y2="28" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="100" x2="64" y2="108" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="64" x2="28" y2="64" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="64" x2="108" y2="64" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round"/>
</svg>
