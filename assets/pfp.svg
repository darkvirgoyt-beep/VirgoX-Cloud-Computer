<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0e1c"/>
      <stop offset="100%" stop-color="#030408"/>
    </radialGradient>
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#2979ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <!-- Outer Hexagon Frame -->
  <polygon points="256,20 468,142 468,370 256,492 44,370 44,142" fill="none" stroke="url(#cyberNeon)" stroke-width="6" filter="url(#neonGlow)"/>
  <!-- Inner Circuit Grid Pattern -->
  <path d="M100,256 H200 M312,256 H412 M256,100 V200 M256,312 V412" stroke="#00e5ff" stroke-width="2" opacity="0.4"/>
  <!-- Central Virgo Symbol / V Shield -->
  <path d="M256,110 L380,180 V332 L256,402 L132,332 V180 Z" fill="rgba(10, 14, 28, 0.85)" stroke="url(#cyberNeon)" stroke-width="4" filter="url(#neonGlow)"/>
  <!-- V Letterform -->
  <path d="M190,190 L256,320 L322,190" fill="none" stroke="url(#cyberNeon)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
  <!-- Core Energy Dot -->
  <circle cx="256" cy="320" r="8" fill="#00ffff" filter="url(#neonGlow)"/>
  <!-- Text Tag -->
  <text x="256" y="445" font-family="'Rajdhani', sans-serif" font-weight="800" font-size="28" fill="#00e5ff" text-anchor="middle" letter-spacing="4" filter="url(#neonGlow)">VIRGOYT</text>
</svg>
